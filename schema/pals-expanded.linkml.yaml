# LinkML schema for the EXPANDED representation of the
# Particle Accelerator Lattice Standard (PALS).

id: https://github.com/pals-project/pals/schema/expanded
name: pals-expanded
title: PALS Expanded Lattice Representation
description: >-
  Formal LinkML schema for the EXPANDED representation of the Particle
  Accelerator Lattice Standard (PALS).

  PALS defines two representations of a lattice (source/overview.md): the
  "exact" representation, which is a direct translation of a PALS input file,
  and the "expanded" representation, in which all beam lines are expanded
  into branches of concrete lattice elements, all expressions are evaluated,
  all `set` commands are applied, all `repeat`/`direction`/subline/
  superposition constructs are materialized, all Placeholder elements are
  removed, all Fork elements are processed into branches, and dependent
  (output) parameters such as ReferenceP and FloorP are computed.

  This schema describes ONLY the expanded representation. In this form the
  `facility` list contains one or more fully concrete `Lattice` entries and
  nothing else. No references (element inheritance, `use`, name references),
  constants, variables, or expressions may appear; every parameter value is
  a literal.

  WIRE FORMAT. PALS serializes named entries (facility items, branches,
  branch elements, and UnionEle sub-elements) as ordered lists of
  single-key mappings, e.g. `- drift1: {kind: Drift}`, and authors as
  `- author: {...}` items. Names need not be unique. That shape is not
  expressible in the LinkML instance model, so this schema describes the
  equivalent NORMALIZED structure in which each entry carries its name in
  an explicit required `name` field, e.g. `{name: drift1, kind: Drift}`.
  The bidirectional transformation between the two forms is purely
  mechanical and is provided by `schema/normalize_names.py` in this
  repository. Validate a PALS expanded file by normalizing it first.

  UNITS. Units follow the PALS conventions (source/fundamentals.md): SI
  except energy in eV; angles in radians; phases in units of rad/2pi.
  Unit metadata on slots is annotation only and is not validated.

  NULL / INF. PALS uses `null` for "not set" and permits `Inf`/`-Inf` for
  reals. In the expanded representation "not set" is expressed by omitting
  the key. JSON Schema cannot represent infinities; their use is legal PALS
  but outside what generated validators can check.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.1.0

prefixes:
  pals: https://github.com/pals-project/pals/schema/expanded/
  linkml: https://w3id.org/linkml/
default_prefix: pals
default_range: string

imports:
  - linkml:types

#=====================================================================
# Enumerations
#=====================================================================

enums:

  PhaseSpaceCoordinatesEnum:
    description: >-
      Phase space coordinate system used in the lattice
      (source/coordinates.md, s:phase.space).
    permissible_values:
      ANGLE_AND_ENERGY:
      ANGLE_AND_MOMENTUM:
      KINETIC_AND_ENERGY:
      KINETIC_AND_MOMENTUM:
        description: Default.

  ApertureShapeEnum:
    description: Aperture shape switch (source/parameters/aperture.md).
    permissible_values:
      RECTANGULAR:
        description: Rectangular shape.
      ELLIPTICAL:
        description: Elliptical shape. Default.
      VERTICES:
        description: Shape defined by a set of vertices.
      CUSTOM_SHAPE:
        description: Shape defined outside of the PALS standard.

  ApertureLocationEnum:
    description: Aperture location switch (source/parameters/aperture.md).
    permissible_values:
      ENTRANCE_END:
        description: Body entrance end. Default.
      CENTER:
        description: Element center.
      EXIT_END:
        description: Body exit end.
      BOTH_ENDS:
      NOWHERE:
      EVERYWHERE:

  BendRefGeometryEnum:
    description: >-
      Reference bend geometry (source/parameters/bend.md, `ref_geometry`).
      Values are lower case in the standard.
    permissible_values:
      arc:
        description: Reference is the curvilinear arc coordinates. Default.
      chord:
        description: >-
          Z-axis is the chord connecting the entrance origin point to the
          exit origin point.
      entrance_coords:
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        description: Rectangular coordinates commensurate with the exit coordinates.

  BendMultipoleGeometryEnum:
    description: >-
      Geometry used to calculate multipoles in a bend
      (source/parameters/bend.md, `multipole_geometry`). Values are lower
      case in the standard.
    permissible_values:
      follows_ref_geometry:
        description: Use geometry equivalent to the setting of `ref_geometry`. Default.
      vertically_pure:
        description: Vertically pure multipoles with arc geometry.
      horizontally_pure:
        description: Horizontally pure multipoles with arc geometry.
      chord:
        description: >-
          Z-axis is the chord connecting the entrance origin point to the
          exit origin point.
      entrance_coords:
        description: Rectangular coordinates commensurate with the entrance coordinates.
      exit_coords:
        description: Rectangular coordinates commensurate with the exit coordinates.

  CavityTypeEnum:
    description: RF cavity type (source/parameters/rf.md).
    permissible_values:
      STANDING_WAVE:
        description: Default.
      TRAVELING_WAVE:

  ZeroPhaseEnum:
    description: Sets what zero RF phase means (source/parameters/rf.md).
    permissible_values:
      ACCELERATING:
        description: Zero phase is the maximum accelerating phase. Default.
      BELOW_TRANSITION:
        description: >-
          Zero phase is at the stable zero crossing for particles below
          transition.
      ABOVE_TRANSITION:
        description: >-
          Zero phase is at the stable zero crossing for particles above
          transition.

  ForkDirectionEnum:
    description: >-
      Longitudinal direction of travel of the injected beam
      (source/parameters/fork.md).
    permissible_values:
      FORWARDS:
        description: Injected particle propagates in the forward (+s) direction. Default.
      BACKWARDS:
        description: Injected particle propagates in the backward (-s) direction.

  PatchRefCoordsEnum:
    description: >-
      Coordinate system defining the length of a Patch
      (source/parameters/patch.md).
    permissible_values:
      ENTRANCE_END:
      EXIT_END:
        description: Default.

#=====================================================================
# Shared slots
#=====================================================================

slots:

  # ----- common named-entry slot -------------------------------------

  name:
    description: >-
      The name of the entry. NORMALIZED-FORM NOTE: in the PALS wire format
      this name is the single key of the entry's mapping
      (`- drift1: {...}`); the normalization pre-pass moves it into this
      field. Names need not be unique; after expansion, repeated instances
      of the same input element share the same name.
    required: true

  # ----- ungrouped element parameters (source/lattice-element-parameters.md)

  kind:
    description: >-
      Kind of element (Quadrupole, Drift, ...). Acts as the type
      designator; its value is the name of a concrete class of this
      schema. `Placeholder` is deliberately NOT a class of this schema
      since Placeholder elements are never present in an expanded lattice
      (source/lattice-element-kinds.md, s:placeholder).
    required: true
    designates_type: true
    range: string

  field_master:
    description: >-
      When there is a change in reference energy: if true, unnormalized
      field strengths (magnetic multipoles, RF, bend fields) are held
      constant and normalized strengths are varied; vice versa if false.
      Default is null (unset).
    range: boolean

  is_on:
    description: >-
      Turns on or off the fields in an element. When off, the element
      looks like a drift.
    range: boolean
    ifabsent: "true"

  length:
    description: >-
      Length of element in meters. For bends this is the arc length.
    range: float
    unit:
      ucum_code: m
    ifabsent: float(0)

  s_position:
    description: >-
      The longitudinal position of the element in meters. In the expanded
      representation this is concrete for every element. Elements in a
      branch are ordered by increasing s_position of their downstream
      ends; zero-length elements at the same s track in list order
      (source/lattice-construction.md).
    range: float
    unit:
      ucum_code: m
    ifabsent: float(0)

  direction:
    description: >-
      Element orientation relative to the branch: +1 (default) or -1
      (reversed). This is the line-item `direction` component of the
      standard (source/beamlines.md, s:line.item); in the expanded
      representation each element instance carries its concrete
      orientation resulting from line reversal expansion.
    range: integer
    minimum_value: -1
    maximum_value: 1
    ifabsent: int(1)

  # ----- parameter-group slots (source/lattice-element-parameter-groups.md)

  ACKickerP:
    description: AC kicker parameters (source/parameters/ackicker.md). Under construction.
    range: ACKickerP
    inlined: true

  ApertureP:
    description: Aperture parameters (source/parameters/aperture.md).
    range: ApertureP
    inlined: true

  BeamBeamP:
    description: Beam-beam interaction parameters (source/parameters/beambeam.md).
    range: BeamBeamP
    inlined: true

  BendP:
    description: Bend parameters (source/parameters/bend.md).
    range: BendP
    inlined: true

  BodyShiftP:
    description: >-
      Orientation of the physical element with respect to its nominal
      position (source/parameters/bodyshift.md).
    range: BodyShiftP
    inlined: true

  ConverterP:
    description: Converter parameters (source/parameters/converter.md). Under construction.
    range: ConverterP
    inlined: true

  ElectricMultipoleP:
    description: Electric multipoles (source/parameters/electricmultipole.md).
    range: ElectricMultipoleP
    inlined: true

  FloorP:
    description: >-
      Floor (global coordinate) position and orientation of the branch
      coordinate system at the element upstream edge
      (source/parameters/floor.md). Output parameters unless `user_set`
      is true (only sensible on BeginningEle).
    range: FloorP
    inlined: true

  FloorShiftP:
    description: Floor shift parameters (source/parameters/floorshift.md).
    range: FloorShiftP
    inlined: true

  FoilP:
    description: Foil parameters (source/parameters/foil.md). Under construction.
    range: FoilP
    inlined: true

  ForkP:
    description: Fork parameters (source/parameters/fork.md).
    range: ForkP
    inlined: true

  GirderP:
    description: Girder parameters (source/parameters/girder.md). Under construction.
    range: GirderP
    inlined: true

  MagneticMultipoleP:
    description: Magnetic multipoles (source/parameters/magneticmultipole.md).
    range: MagneticMultipoleP
    inlined: true

  MetaP:
    description: >-
      Metadata parameters (source/parameters/meta.md). Besides the six
      standard components (alias, ID, label, description, location,
      history), MetaP may hold arbitrary custom metadata that does not
      affect tracking; this class is therefore OPEN — unknown keys inside
      MetaP are permitted.
    range: MetaP
    inlined: true

  ParticleP:
    description: >-
      Single-particle coordinates or Gaussian beam distribution moments
      (source/parameters/particle.md). NOTE: the standard currently
      attaches this group to no element kind.
    range: ParticleP
    inlined: true

  PatchP:
    description: >-
      Exit coordinates with respect to entrance coordinates
      (source/parameters/patch.md).
    range: PatchP
    inlined: true

  ReferenceP:
    description: >-
      Reference energy, species, and time at the upstream end of the
      element (source/parameters/reference.md). User settable only on
      BeginningEle; an output (computed) parameter group on every other
      element kind — in the expanded representation the computed values
      are concrete and may be serialized on any element.
    range: ReferenceP
    inlined: true

  ReferenceChangeP:
    description: >-
      Adjustment of reference parameters
      (source/parameters/referencechange.md).
    range: ReferenceChangeP
    inlined: true

  RFP:
    description: RF parameters (source/parameters/rf.md).
    range: RFP
    inlined: true

  SolenoidP:
    description: Solenoid field (source/parameters/solenoid.md).
    range: SolenoidP
    inlined: true

  TaylorP:
    description: >-
      Orbital and spin Taylor map (source/parameters/taylor.md).
      NORMALIZED-FORM NOTE: the standard writes Taylor series as
      `term <coef> <e1> ... <e6>` lines; this schema represents each
      series as a list of TaylorTerm objects
      `{coef: <coef>, exponents: [<e1>, ..., <e6>]}`.
    range: TaylorP
    inlined: true

  TrackingP:
    description: >-
      Program-specific tracking parameters keyed by program name
      (source/parameters/tracking.md). Free-form by design; not validated.
    range: Any
    inlined: true

  TwissP:
    description: >-
      Initial Twiss, coupling, and dispersion parameters, typically at the
      beginning of a lattice branch (source/parameters/twiss.md). NOTE:
      the standard currently attaches this group to no element kind.
    range: TwissP
    inlined: true

#=====================================================================
# Utility classes
#=====================================================================

classes:

  Any:
    description: Arbitrary structured content (not validated).
    class_uri: linkml:Any

  Author:
    description: >-
      An author associated with this file (source/fundamentals.md,
      s:palsroot). WIRE-FORMAT NOTE: serialized as `- author: {...}` list
      items; the normalization pre-pass unwraps the fixed `author` key.
    attributes:
      name:
        description: Author name, e.g. "Lastname, Firstname". Required.
        required: true
      orcid:
        description: ORCID identifier of the author.
      affiliation:
        description: Affiliation long name.
      email:
        description: Contact email address.

  ExtensionLabel:
    description: >-
      A single registered extension label; the key is the label and the
      value its short description (source/extensions.md).
    attributes:
      label:
        identifier: true
        description: The registered name, prefix, or suffix.
      description:
        description: Short description of the extension label.

  ExtensionLabels:
    description: >-
      Registered extension labels (source/extensions.md). Any key name or
      enum value in the PALS file matching one of the registered names, or
      carrying a registered prefix or suffix, is treated as an extension
      and is excluded from PALS validation. At least one of the three
      components is required (documented; not machine-enforced here).
    attributes:
      names:
        description: Dictionary of extension names to descriptions.
        range: ExtensionLabel
        multivalued: true
        inlined: true
      prefixes:
        description: Dictionary of extension prefixes to descriptions.
        range: ExtensionLabel
        multivalued: true
        inlined: true
      suffixes:
        description: Dictionary of extension suffixes to descriptions.
        range: ExtensionLabel
        multivalued: true
        inlined: true

  ApertureVertexItem:
    description: >-
      One item of an aperture vertex list (source/parameters/aperture.md).
      Exactly one of `point`, `radius`, or `tilt` must be set per item
      (documented; the wire format writes each item as a single-key
      mapping which is directly valid against this class). A `radius` may
      appear between two points (or after the last point, closing the
      shape); `tilt` may only be present if a `radius` is present.
    attributes:
      point:
        description: Vertex position; vector of two real numbers [m].
        range: float
        multivalued: true
      radius:
        description: >-
          Arc radius between the surrounding points [m]; a single value
          for a circular arc or two values for the half lengths of the
          principal diameters of an elliptical arc.
        range: float
        multivalued: true
      tilt:
        description: Ellipse tilt angle [rad/2pi].
        range: float

  ApertureVertices:
    description: >-
      Aperture shape defined by a set of vertices
      (source/parameters/aperture.md, `vertices`).
    attributes:
      center:
        description: Vector of (x, y) center point [m].
        range: float
        multivalued: true
      absolute_vertices:
        description: >-
          If false (default), vertex point positions are relative to
          `center`; if true they are independent of `center`.
        range: boolean
        ifabsent: "false"
      list:
        description: Ordered list of vertex points.
        range: ApertureVertexItem
        multivalued: true
        inlined_as_list: true

  TaylorTerm:
    description: >-
      One monomial of a Taylor series (source/parameters/taylor.md):
      coef * x^e1 * px^e2 * y^e3 * py^e4 * z^e5 * pz^e6.
    attributes:
      coef:
        description: Real valued coefficient of the monomial.
        range: float
        required: true
      exponents:
        description: >-
          The six integer exponents (e1 ... e6) for
          (x, px, y, py, z, pz), in order. Exactly six values.
        range: integer
        multivalued: true
        required: true

  PhaseSpaceRef:
    description: >-
      Orbital reference point about which a Taylor map is constructed
      (source/parameters/taylor.md, `ref_in`). Component meaning is set
      by `phase_space_coordinates`.
    attributes:
      x:
        description: x orbital component of the reference point.
        range: float
      px:
        description: px orbital component of the reference point.
        range: float
      y:
        description: y orbital component of the reference point.
        range: float
      py:
        description: py orbital component of the reference point.
        range: float
      z:
        description: z orbital component of the reference point.
        range: float
      pz:
        description: pz orbital component of the reference point.
        range: float

#=====================================================================
# Parameter groups
#=====================================================================

  ACKickerP:
    description: >-
      AC kicker parameters (source/parameters/ackicker.md). The standard
      marks this group "In Construction" and documents no parameters yet.

  ApertureP:
    description: >-
      Aperture description (source/parameters/aperture.md). The horizontal
      aperture may be specified by x_min/x_max OR x_center/x_width but not
      both; similarly for the vertical aperture.
    attributes:
      x_min:
        description: Left aperture limit [m].
        range: float
        unit:
          ucum_code: m
      x_max:
        description: Right aperture limit [m].
        range: float
        unit:
          ucum_code: m
      x_center:
        description: Center of horizontal aperture [m].
        range: float
        unit:
          ucum_code: m
      x_width:
        description: Horizontal aperture full width [m].
        range: float
        unit:
          ucum_code: m
      y_min:
        description: Bottom aperture limit [m].
        range: float
        unit:
          ucum_code: m
      y_max:
        description: Top aperture limit [m].
        range: float
        unit:
          ucum_code: m
      y_center:
        description: Center of vertical aperture [m].
        range: float
        unit:
          ucum_code: m
      y_width:
        description: Vertical aperture full width [m].
        range: float
        unit:
          ucum_code: m
      shape:
        description: Aperture shape switch.
        range: ApertureShapeEnum
        ifabsent: string(ELLIPTICAL)
      location:
        description: Aperture location switch.
        range: ApertureLocationEnum
        ifabsent: string(ENTRANCE_END)
      vertices:
        description: Vertex-defined aperture shape (used with shape VERTICES).
        range: ApertureVertices
        inlined: true
      material:
        description: >-
          Material of the aperture. Using chemical formulas like Cu and Fe
          is the most portable.
      thickness:
        description: Aperture thickness [m].
        range: float
        unit:
          ucum_code: m
        ifabsent: float(0)
      aperture_shifts_with_body:
        description: >-
          Whether misaligning the element affects the placement of the
          aperture.
        range: boolean
        ifabsent: "false"
      aperture_active:
        description: false implies the aperture is not operating.
        range: boolean
        ifabsent: "true"
    rules:
      # Note: each rule carries exactly one ABSENT postcondition slot so
      # that the JSON Schema translation (then: {not: {required: [...]}})
      # enforces per-slot absence.
      - description: x_center/x_width excludes x_min.
        preconditions:
          any_of:
            - slot_conditions:
                x_center:
                  value_presence: PRESENT
            - slot_conditions:
                x_width:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            x_min:
              value_presence: ABSENT
      - description: x_center/x_width excludes x_max.
        preconditions:
          any_of:
            - slot_conditions:
                x_center:
                  value_presence: PRESENT
            - slot_conditions:
                x_width:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            x_max:
              value_presence: ABSENT
      - description: y_center/y_width excludes y_min.
        preconditions:
          any_of:
            - slot_conditions:
                y_center:
                  value_presence: PRESENT
            - slot_conditions:
                y_width:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            y_min:
              value_presence: ABSENT
      - description: y_center/y_width excludes y_max.
        preconditions:
          any_of:
            - slot_conditions:
                y_center:
                  value_presence: PRESENT
            - slot_conditions:
                y_width:
                  value_presence: PRESENT
        postconditions:
          slot_conditions:
            y_max:
              value_presence: ABSENT

  BeamBeamP:
    description: >-
      Parameters of an oppositely moving "strong" beam generating
      electromagnetic fields at the interaction point, assumed 3D Gaussian
      (source/parameters/beambeam.md). All defaults are null (unset).
    attributes:
      sigma_x:
        description: Horizontal beam size of the opposite beam [m].
        range: float
        unit:
          ucum_code: m
      sigma_y:
        description: Vertical beam size of the opposite beam [m].
        range: float
        unit:
          ucum_code: m
      sigma_z:
        description: Longitudinal beam size of the opposite beam [m].
        range: float
        unit:
          ucum_code: m
      alpha_x:
        description: Horizontal Twiss alpha at the interaction point [unitless].
        range: float
      beta_x:
        description: Horizontal Twiss beta at the interaction point [m].
        range: float
        unit:
          ucum_code: m
      alpha_y:
        description: Vertical Twiss alpha at the interaction point [unitless].
        range: float
      beta_y:
        description: Vertical Twiss beta at the interaction point [m].
        range: float
        unit:
          ucum_code: m
      charge:
        description: Charge of the opposite beam [unitless].
        range: float
      energy:
        description: Total energy of the opposite beam [eV].
        range: float
        unit:
          ucum_code: eV
      N_particle:
        description: Number of particles in the opposite beam [unitless].
        range: float

  BendP:
    description: >-
      Shape parameters of a Bend element (source/parameters/bend.md). The
      parameters g_ref, angle_ref, rho_ref, and length are mutually
      dependent; specifying more than two can be contradictory
      (documented; not machine-enforced).
    attributes:
      angle_ref:
        description: >-
          Total reference bend angle [rad]; angle_ref = length * g_ref.
        range: float
        unit:
          ucum_code: rad
        ifabsent: float(0)
      bend_field_ref:
        description: >-
          Reference bend field [T] needed for the reference particle to be
          bent in a circle of radius rho_ref.
        range: float
        unit:
          ucum_code: T
        ifabsent: float(0)
      bend_field_actual:
        description: >-
          OUTPUT parameter. Actual bend field perpendicular to the
          reference plane [T].
        range: float
        unit:
          ucum_code: T
      e1:
        description: >-
          Entrance end pole face rotation with respect to a sector
          geometry [rad].
        range: float
        unit:
          ucum_code: rad
        ifabsent: float(0)
      e2:
        description: >-
          Exit end pole face rotation with respect to a sector geometry
          [rad].
        range: float
        unit:
          ucum_code: rad
        ifabsent: float(0)
      e1_rect:
        description: >-
          Entrance end pole face rotation with respect to a rectangular
          geometry [rad].
        range: float
        unit:
          ucum_code: rad
        ifabsent: float(0)
      e2_rect:
        description: >-
          Exit end pole face rotation with respect to a rectangular
          geometry [rad].
        range: float
        unit:
          ucum_code: rad
        ifabsent: float(0)
      edge1_int:
        description: Entrance end fringe field integral [T*m].
        range: float
        unit:
          ucum_code: T.m
        ifabsent: float(0)
      edge2_int:
        description: Exit end fringe field integral [T*m].
        range: float
        unit:
          ucum_code: T.m
        ifabsent: float(0)
      g_ref:
        description: >-
          Reference bend strength [1/m]; g_ref = 1/rho_ref.
        range: float
        unit:
          ucum_code: m-1
        ifabsent: float(0)
      g_actual:
        description: >-
          OUTPUT parameter. Actual bending strength corresponding to
          bend_field_actual [1/m].
        range: float
        unit:
          ucum_code: m-1
      h1:
        description: Entrance end pole face curvature [1/m].
        range: float
        unit:
          ucum_code: m-1
        ifabsent: float(0)
      h2:
        description: Exit end pole face curvature [1/m].
        range: float
        unit:
          ucum_code: m-1
        ifabsent: float(0)
      L_chord:
        description: Chord length [m].
        range: float
        unit:
          ucum_code: m
        ifabsent: float(0)
      L_sagitta:
        description: >-
          OUTPUT parameter. Sagitta length [m]; may be negative, with the
          same sign as g_ref.
        range: float
        unit:
          ucum_code: m
      L_rectangle:
        description: Rectangular length of the bend [m].
        range: float
        unit:
          ucum_code: m
        ifabsent: float(0)
      multipole_geometry:
        description: Sets how multipoles are calculated.
        range: BendMultipoleGeometryEnum
        ifabsent: string(follows_ref_geometry)
      ref_geometry:
        description: Reference bend geometry.
        range: BendRefGeometryEnum
        ifabsent: string(arc)
