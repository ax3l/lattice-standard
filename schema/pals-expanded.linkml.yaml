        description: Tapering parameter associated with Bn0.
        range: float
      Bs0_taper:
        description: Tapering parameter associated with Bs0.
        range: float
      Kn0_taper:
        description: Tapering parameter associated with Kn0.
        range: float
      Ks0_taper:
