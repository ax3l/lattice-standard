  FloorP:
    description: >-
      Placement (position and orientation) of the branch coordinate system
      at the element upstream edge in global coordinates
      (source/parameters/floor.md). Input if user_set is true, otherwise
      computed (output).
    attributes:
      x:
        description: Global x-coordinate [m].
        range: float
        unit:
          ucum_code: m
      y:
        description: Global y-coordinate [m].
        range: float
        unit:
          ucum_code: m
      z:
        description: Global z-coordinate [m].
        range: float
        unit:
          ucum_code: m
      theta:
        description: Orientation angle theta [rad].
        range: float
        unit:
          ucum_code: rad
      phi:
        description: Orientation angle phi [rad].
        range: float
        unit:
          ucum_code: rad
      psi:
        description: Orientation angle psi [rad].
        range: float
        unit:
          ucum_code: rad
      user_set:
        description: Is the placement set by the user or computed?
        range: boolean
        ifabsent: "false"

  FloorShiftP:
    description: >-
      Shift of the reference curve of a FloorShift element
      (source/parameters/floorshift.md). The standard does not state units
      explicitly; PALS conventions imply meters for offsets, seconds for
      t_offset, and radians for rotations.
    attributes:
      x_offset:
        description: Offset in x-direction [m].
        range: float
        unit:
          ucum_code: m
      y_offset:
        description: Offset in y-direction [m].
        range: float
        unit:
          ucum_code: m
      z_offset:
        description: Offset in z-direction [m].
        range: float
