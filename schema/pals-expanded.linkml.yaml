      Kn21L_taper:
        description: Tapering parameter associated with Kn21L.
        range: float
      Ks21L_taper:
        description: Tapering parameter associated with Ks21L.
        range: float

  MetaP:
    description: >-
      Metadata parameters (source/parameters/meta.md). Six standard
      components plus arbitrary custom metadata (blueprint information,
      power supply connections, ...). Information in MetaP must not
      affect tracking. THIS CLASS IS OPEN: keys beyond the standard six
      are permitted and are not validated.
    attributes:
      alias:
        description: An alternate name for the element.
      ID:
        description: Element identification.
      label:
        description: A label string.
      description:
        description: >-
          A descriptive string; not limited to a simple string, may be a
          complex structure.
        range: Any
        inlined: true
      location:
        description: >-
          Element's location; not limited to a simple string, may be a
          complex structure.
        range: Any
        inlined: true
      history:
        description: >-
          Element's history; not limited to a simple string, may be a
          complex structure.
        range: Any
        inlined: true

  ParticleP:
    description: >-
      Single particle coordinates or Gaussian beam distribution moments
      (source/parameters/particle.md). Mean values default to 0; sigma
      second moments default to null and are not relevant for a single
      particle. Phase space component meaning is set by
      phase_space_coordinates.
    attributes:
      x:
        description: Mean x phase space component.
        range: float
        ifabsent: float(0)
      px:
        description: Mean px phase space component.
        range: float
        ifabsent: float(0)
      y:
        description: Mean y phase space component.
        range: float
        ifabsent: float(0)
      py:
        description: Mean py phase space component.
        range: float
        ifabsent: float(0)
      z:
        description: Mean z phase space component.
        range: float
        ifabsent: float(0)
      pz:
        description: Mean pz phase space component.
        range: float
        ifabsent: float(0)
      spin_x:
        description: Mean spin x-component.
        range: float
        ifabsent: float(0)
      spin_y:
        description: Mean spin y-component.
        range: float
        ifabsent: float(0)
      spin_z:
        description: Mean spin z-component.
        range: float
        ifabsent: float(0)
      sigma_xx:
        description: Second moment <x^2>.
        range: float
      sigma_xpx:
        description: Second moment <x*px>.
        range: float
      sigma_xy:
        description: Second moment <x*y>.
        range: float
      sigma_xpy:
        description: Second moment <x*py>.
        range: float
      sigma_xz:
        description: Second moment <x*z>.
        range: float
      sigma_xpz:
        description: Second moment <x*pz>.
        range: float
      sigma_pxpx:
        description: Second moment <px^2>.
        range: float
      sigma_pxy:
        description: Second moment <px*y>.
        range: float
      sigma_pxpy:
        description: Second moment <px*py>.
        range: float
      sigma_pxz:
        description: Second moment <px*z>.
        range: float
      sigma_pxpz:
        description: Second moment <px*pz>.
        range: float
      sigma_yy:
        description: Second moment <y^2>.
        range: float
      sigma_ypy:
        description: Second moment <y*py>.
        range: float
      sigma_yz:
        description: Second moment <y*z>.
        range: float
      sigma_ypz:
        description: Second moment <y*pz>.
        range: float
      sigma_pypy:
        description: Second moment <py^2>.
        range: float
      sigma_pyz:
        description: Second moment <py*z>.
        range: float
      sigma_pypz:
        description: Second moment <py*pz>.
        range: float
      sigma_zz:
        description: Second moment <z^2>.
        range: float
      sigma_zpz:
        description: Second moment <z*pz>.
        range: float
      sigma_pzpz:
        description: Second moment <pz^2>.
        range: float

  PatchP:
    description: >-
      Shift of the reference curve of a Patch element
      (source/parameters/patch.md). To shift reference energy, time, or
      species, use ReferenceChangeP.
    attributes:
      x_offset:
        description: Offset in x-direction [m].
        range: float
        unit:
          ucum_code: m
      y_offset:
        description: Offset in y-direction [m].
        range: float
        unit:
          ucum_code: m
      z_offset:
        description: Offset in z-direction [m].
        range: float
        unit:
          ucum_code: m
      x_rot:
        description: Rotation around x-axis [rad].
        range: float
        unit:
          ucum_code: rad
      y_rot:
        description: Rotation around y-axis [rad].
        range: float
        unit:
          ucum_code: rad
      z_rot:
        description: Rotation around z-axis [rad].
        range: float
        unit:
          ucum_code: rad
      flexible:
        description: >-
          true: user sets offsets and rotations. false (default): offsets
          and rotations are computed from the branch layout.
        range: boolean
        ifabsent: "false"
      ref_coords:
        description: Coordinate system defining the length.
        range: PatchRefCoordsEnum
        ifabsent: string(EXIT_END)
      user_sets_length:
        description: Is the element length user set?
        range: boolean
        ifabsent: "false"

  ReferenceP:
    description: >-
      Reference energy, species, and time at the upstream end of the
      element (source/parameters/reference.md). User settable on
      BeginningEle only; output (computed) on all other kinds.
    attributes:
      species_ref:
        description: Reference species.
      pc_ref:
        description: Reference momentum times speed of light [eV; momentum*c].
        range: float
        ifabsent: float(0)
      E_tot_ref:
        description: Reference total energy [eV].
        range: float
        unit:
          ucum_code: eV
        ifabsent: float(0)
      time_ref:
        description: Reference time [s].
        range: float
        unit:
          ucum_code: s
        ifabsent: float(0)

  ReferenceChangeP:
    description: >-
      Adjustment of reference parameters
      (source/parameters/referencechange.md). Adjustments are only made
      for non-null parameters. Only one of dE_ref, dpc_ref, E_tot_ref,
      and pc_ref may be present; similarly only one of dtime_ref and
      time_ref may be present.
    attributes:
      dtime_ref:
        description: Reference time adjustment [s].
        range: float
        unit:
          ucum_code: s
      dE_ref:
        description: Reference energy adjustment [eV].
        range: float
        unit:
          ucum_code: eV
      dpc_ref:
        description: Reference momentum adjustment [eV].
        range: float
        unit:
          ucum_code: eV
      time_ref:
        description: >-
          Set reference time [s]. (The standard's component table lists
          eV, an apparent typo for a time quantity.)
        range: float
        unit:
          ucum_code: s
      E_tot_ref:
        description: Set reference energy [eV].
        range: float
        unit:
          ucum_code: eV
      pc_ref:
        description: Set reference momentum [eV].
        range: float
        unit:
          ucum_code: eV
      species_ref:
        description: Set reference species.
      extra_dtime_ref:
        description: >-
          Correction to the reference time for particle motion that is not
          straight or acceleration that is not linear in energy [s].
          Referenced by the standard's prose (source/parameters/patch.md
          and referencechange.md) though absent from the component table;
          flagged as a documentation inconsistency.
        range: float
        unit:
          ucum_code: s
    rules:
      # Only one of dE_ref, dpc_ref, E_tot_ref, and pc_ref may be present
      # (pairwise exclusions, one ABSENT postcondition slot per rule so
      # the JSON Schema translation enforces per-slot absence).
      - description: dE_ref excludes dpc_ref.
        preconditions:
          slot_conditions:
            dE_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            dpc_ref:
              value_presence: ABSENT
      - description: dE_ref excludes E_tot_ref.
        preconditions:
          slot_conditions:
            dE_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            E_tot_ref:
              value_presence: ABSENT
      - description: dE_ref excludes pc_ref.
        preconditions:
          slot_conditions:
            dE_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            pc_ref:
              value_presence: ABSENT
      - description: dpc_ref excludes E_tot_ref.
        preconditions:
          slot_conditions:
            dpc_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            E_tot_ref:
              value_presence: ABSENT
      - description: dpc_ref excludes pc_ref.
        preconditions:
          slot_conditions:
            dpc_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            pc_ref:
              value_presence: ABSENT
      - description: E_tot_ref excludes pc_ref.
        preconditions:
          slot_conditions:
            E_tot_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            pc_ref:
              value_presence: ABSENT
      - description: Only one of dtime_ref and time_ref may be present.
        preconditions:
          slot_conditions:
            dtime_ref:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            time_ref:
              value_presence: ABSENT

  RFP:
    description: >-
      RF parameters (source/parameters/rf.md). Either frequency or harmon
      should be set but not both; either voltage or gradient should be set
      but not both (voltage = gradient * L_active).
    attributes:
      frequency:
        description: RF frequency [Hz].
        range: float
        unit:
          ucum_code: Hz
        ifabsent: float(0)
      harmon:
        description: >-
          RF frequency harmonic number [unitless];
          frequency = harmon / t1_ref with t1_ref the 1-turn reference
          time.
        range: float
        ifabsent: float(0)
      voltage:
        description: RF voltage [V].
        range: float
        unit:
          ucum_code: V
        ifabsent: float(0)
      gradient:
        description: RF gradient [V/m].
        range: float
        unit:
          ucum_code: V.m-1
        ifabsent: float(0)
      phase:
        description: RF phase in units of rad/2pi.
        range: float
        ifabsent: float(0)
      multipass_phase:
        description: RF phase added to multipass elements [rad/2pi].
        range: float
        ifabsent: float(0)
      cavity_type:
        description: Cavity type.
        range: CavityTypeEnum
        ifabsent: string(STANDING_WAVE)
      num_cells:
        description: Number of cavity cells. Default null.
        range: integer
      zero_phase:
        description: Sets what phase = 0 means.
        range: ZeroPhaseEnum
        ifabsent: string(ACCELERATING)
      L_active:
        description: >-
          Active acceleration length [m]; the longitudinal length over
          which there is an RF field. If not given, defaults to the value
          of the element length.
        range: float
        unit:
          ucum_code: m
      dE_ref:
        description: >-
          Change in reference energy [eV]; the downstream reference energy
          is E_tot_ref + dE_ref.
        range: float
        unit:
          ucum_code: eV
        ifabsent: float(0)
    rules:
      - description: Either frequency or harmon should be set but not both.
        preconditions:
          slot_conditions:
            frequency:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            harmon:
              value_presence: ABSENT
      - description: Either voltage or gradient should be set but not both.
        preconditions:
          slot_conditions:
            voltage:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            gradient:
              value_presence: ABSENT

  SolenoidP:
    description: >-
      Magnetic solenoid description (source/parameters/solenoid.md);
      Ksol = q/P0 * Bsol.
    attributes:
      Ksol:
        description: Normalized solenoid strength [1/m].
        range: float
        unit:
          ucum_code: m-1
      Bsol:
        description: Solenoid field [T].
        range: float
        unit:
          ucum_code: T

  TaylorP:
    description: >-
      Taylor transport map from entrance to exit, including orbital phase
      space and spin (source/parameters/taylor.md). Orbital component
      meaning is set by phase_space_coordinates; spin transport uses a
      quaternion rotation representation and is independent of the input
      spin coordinates. NORMALIZED-FORM NOTE: the standard's
      `term <coef> <e1> ... <e6>` lines are represented as lists of
      TaylorTerm objects.
    attributes:
      x_out:
        description: Taylor series for output x orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      px_out:
        description: Taylor series for output px orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      y_out:
        description: Taylor series for output y orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      py_out:
        description: Taylor series for output py orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      z_out:
        description: Taylor series for output z orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      pz_out:
        description: Taylor series for output pz orbital component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      S_q1_out:
        description: Taylor series for output spin q1 quaternion component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      S_qx_out:
        description: Taylor series for output spin qx quaternion component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      S_qy_out:
        description: Taylor series for output spin qy quaternion component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      S_qz_out:
        description: Taylor series for output spin qz quaternion component.
        range: TaylorTerm
        multivalued: true
        inlined_as_list: true
      ref_in:
        description: Input orbital reference point for the map.
        range: PhaseSpaceRef
        inlined: true

  TwissP:
    description: >-
      Initial Twiss, coupling, and dispersion parameters, typically
      specified at the beginning of a lattice branch
      (source/parameters/twiss.md).
    attributes:
      alpha_a:
        description: '"a" mode alpha [unitless].'
        range: float
      alpha_b:
        description: '"b" mode alpha [unitless].'
        range: float
      beta_a:
        description: '"a" mode beta [m].'
        range: float
        unit:
          ucum_code: m
      beta_b:
        description: '"b" mode beta [m].'
        range: float
        unit:
          ucum_code: m
      cmat11:
        description: c[1,1] coupling matrix component [unitless].
        range: float
      cmat12:
        description: c[1,2] coupling matrix component [m].
        range: float
        unit:
          ucum_code: m
      cmat21:
        description: c[2,1] coupling matrix component [1/m].
        range: float
        unit:
          ucum_code: m-1
      cmat22:
        description: c[2,2] coupling matrix component [unitless].
        range: float
      eta_x:
        description: x-axis dispersion [m].
        range: float
        unit:
          ucum_code: m
      eta_y:
        description: y-axis dispersion [m].
        range: float
        unit:
          ucum_code: m
      etap_x:
        description: x-axis momentum dispersion [unitless].
        range: float
      etap_y:
        description: y-axis momentum dispersion [unitless].
        range: float
      deta_x_ds:
        description: x-axis dispersion derivative [unitless].
        range: float
      deta_y_ds:
        description: y-axis dispersion derivative [unitless].
        range: float
      phi_a:
        description: '"a" mode phase [rad].'
        range: float
        unit:
          ucum_code: rad
      phi_b:
        description: '"b" mode phase [rad].'
        range: float
        unit:
          ucum_code: rad

#=====================================================================
# Lattice elements
#=====================================================================

  LatticeElement:
    abstract: true
    description: >-
      Abstract base of all lattice element kinds
      (source/lattice-elements.md). The `kind` slot is the type
      designator; concrete classes are named exactly like the PALS
      element kinds.
    slots:
      - name
      - kind
    slot_usage:
      name:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"

  InlineElement:
    abstract: true
    is_a: LatticeElement
    description: >-
      Abstract base of element kinds that sit inside a branch and carry
      the ungrouped element parameters
      (source/lattice-element-parameters.md, s:non.params). Girder and
      Feedback elements are NOT InlineElements since the standard states
      they have neither length nor s_position.
    slots:
      - length
      - s_position
      - is_on
      - field_master
      - direction

  ACKicker:
    is_a: InlineElement
    description: >-
      Time-dependent kicker (source/lattice-element-kinds.md,
      s:ackicker).
    slots:
      - ACKickerP
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP

  BeamBeam:
    is_a: InlineElement
    description: >-
      Oppositely moving "strong" beam generating electromagnetic fields at
      the interaction point (source/lattice-element-kinds.md, s:beambeam).
      Zero length.
    slots:
      - ApertureP
      - BeamBeamP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  BeginningEle:
    is_a: InlineElement
    description: >-
      Initial element at the start of a branch
      (source/lattice-element-kinds.md, s:beginningele). Zero length. The
      first element of every expanded branch must be its only
      BeginningEle (documented; not machine-enforced). ReferenceP and
      FloorP are user settable on this kind.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  Bend:
    is_a: InlineElement
    description: >-
      Dipole bend; the curvilinear coordinate system through the element
      is an arc with finite curvature
      (source/lattice-element-kinds.md, s:bend). The element length is
      the arc length.
    slots:
      - ApertureP
      - BendP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Converter:
    is_a: InlineElement
    description: >-
      Target (plate) onto which particles are slammed to generate
      particles of a different type
      (source/lattice-element-kinds.md, s:converter). Under construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ConverterP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  CrabCavity:
    is_a: InlineElement
    description: >-
      RF cavity that gives a longitudinal dependent transverse kick
      (source/lattice-element-kinds.md, s:crabcavity). DOC INCONSISTENCY
      (flagged upstream): the standard's prose calls this a "zero length
      RF cavity" but states no must-be-zero rule, and its group list
      omits RFP although its example sets RFP; this schema includes RFP
      and does not constrain the length.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - RFP
      - TrackingP

  Drift:
    is_a: InlineElement
    description: >-
      A space free and clear of any fields
      (source/lattice-element-kinds.md, s:drift).
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP

  EGun:
    is_a: InlineElement
    description: >-
      Electron gun; encompasses a region starting from the cathode where
      the electrons are generated
      (source/lattice-element-kinds.md, s:egun). Under construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Feedback:
    is_a: LatticeElement
    description: >-
      Feedback circuit element (source/lattice-element-kinds.md,
      s:feedback). Under construction; the standard documents no
      parameter groups. This element has neither length nor s_position.

  Fiducial:
    is_a: InlineElement
    description: >-
      Fixes the position and orientation of the reference orbit within
      the global coordinate system at its location; affects floor
      coordinates both upstream and downstream
      (source/lattice-element-kinds.md, s:fiducial). Under construction;
      the standard documents no parameter groups. Zero length.
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  FloorShift:
    is_a: InlineElement
    description: >-
      Shifts the reference curve in the global coordinate system without
      affecting particle tracking
      (source/lattice-element-kinds.md, s:floorshift).
    slots:
      - FloorShiftP
      - MetaP
      - ReferenceP

  Foil:
    is_a: InlineElement
    description: >-
      Planar sheet of material which can strip electrons from a particle
      (source/lattice-element-kinds.md, s:foil). Under construction.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - FoilP
      - MetaP
      - ReferenceP
      - TrackingP

  Fork:
    is_a: InlineElement
    description: >-
      Marks the start of an alternative branch for the beam (or for
      X-rays or other particles generated by the beam) to follow;
      connects lattice branches together
      (source/lattice-element-kinds.md, s:fork). Zero length; ForkP is
      required.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - ForkP
      - MetaP
      - ReferenceP
      - TrackingP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0
      ForkP:
        required: true

  Girder:
    is_a: LatticeElement
    description: >-
      Support structure that orients the elements attached to it in space
      (source/lattice-element-kinds.md, s:girder). Under construction;
      the GirderP group is registered but unspecified. This element has
      neither length nor s_position.
    slots:
      - GirderP

  Instrument:
    is_a: InlineElement
    description: >-
      Measurement element for diagnostics
      (source/lattice-element-kinds.md, s:instrument). Under
      construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Kicker:
    is_a: InlineElement
    description: >-
      Element that can deflect a beam transversely in both planes using a
      zero-order multipole field
      (source/lattice-element-kinds.md, s:kicker). Under construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Marker:
    is_a: InlineElement
    description: >-
      Zero length element to mark (name) a particular position; unit
      transport map (source/lattice-element-kinds.md, s:marker). The last
      element of an expanded branch must be a Marker (documented; not
      machine-enforced).
    slots:
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  Mask:
    is_a: InlineElement
    description: >-
      Collimation element defining an aperture of essentially arbitrary
      shape (source/lattice-element-kinds.md, s:mask). Under
      construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Match:
    is_a: InlineElement
    description: >-
      Matches the orbit, Twiss, and dispersion parameters between two
      locations (source/lattice-element-kinds.md, s:match). Under
      construction. Zero length.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  Multipole:
    is_a: InlineElement
    description: >-
      General multipole element; fields are assumed uniform along the
      longitudinal direction and may contain multipole contributions of
      any order (source/lattice-element-kinds.md, s:multipole).
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Octupole:
    is_a: InlineElement
    description: >-
      Element whose major field has a cubic dependence on transverse
      offset (source/lattice-element-kinds.md, s:octupole).
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Patch:
    is_a: InlineElement
    description: >-
      Shifts the reference orbit and time; commonly used to orient two
      lines with respect to each other
      (source/lattice-element-kinds.md, s:patch). Under construction.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - PatchP
      - ReferenceP
      - TrackingP

  Quadrupole:
    is_a: InlineElement
    description: >-
      Element whose major field has a linear dependence on transverse
      offset (source/lattice-element-kinds.md, s:quadrupole).
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  ReferenceChange:
    is_a: InlineElement
    description: >-
      Adjusts reference parameters at any location in a branch; the
      adjusted values are used for downstream elements
      (source/lattice-element-kinds.md, s:reference.change).
    slots:
      - FloorP
      - MetaP
      - ReferenceChangeP
      - ReferenceP
      - TrackingP

  RFCavity:
    is_a: InlineElement
    description: >-
      RF cavity that accelerates or decelerates and focuses or defocuses
      a charged particle beam using RF fields
      (source/lattice-element-kinds.md, s:rfcavity). Under construction.
      Multipole parameters represent DC fields.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - RFP
      - SolenoidP
      - TrackingP

  Sextupole:
    is_a: InlineElement
    description: >-
      Element whose major field has a quadratic dependence on transverse
      offset (source/lattice-element-kinds.md, s:sextupole).
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

  Solenoid:
    is_a: InlineElement
    description: >-
      Element whose magnetic field is dominated by a field aligned with
      the magnetic axis (source/lattice-element-kinds.md, s:solenoid).
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - SolenoidP
      - TrackingP

  Taylor:
    is_a: InlineElement
    description: >-
      Taylor map from entrance coordinates to exit coordinates
      (source/lattice-element-kinds.md, s:taylor). Under construction.
      Zero length.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TaylorP
      - TrackingP
    slot_usage:
      length:
        minimum_value: 0
        maximum_value: 0

  UnionEle:
    is_a: InlineElement
    description: >-
      Holds a set of overlapping elements
      (source/lattice-element-kinds.md, s:unionele). Each contained
      element is nominally centered at the center of the UnionEle; use
      the contained elements' BodyShiftP to shift them. WIRE-FORMAT NOTE:
      the standard serializes `elements` as a mapping of name to element;
      the normalization pre-pass converts it to a list with explicit
      `name` fields.
    slots:
      - ApertureP
      - BodyShiftP
      - FloorP
      - MetaP
      - ReferenceP
      - TrackingP
    attributes:
      elements:
        description: The contained (overlapping) elements.
        range: InlineElement
        multivalued: true
        inlined_as_list: true

  Wiggler:
    is_a: InlineElement
    description: >-
      Periodic array of alternating bending magnets (wiggler or
      undulator) (source/lattice-element-kinds.md, s:wiggler). Under
      construction.
    slots:
      - ApertureP
      - BodyShiftP
      - ElectricMultipoleP
      - FloorP
      - MagneticMultipoleP
      - MetaP
      - ReferenceP
      - TrackingP

#=====================================================================
# Containers and root
#=====================================================================

  Branch:
    description: >-
      An ordered list of concrete lattice elements that can be tracked
      through (source/definitions.md). In the expanded representation the
      element list is fully materialized: the first element must be the
      branch's only BeginningEle, the last element must be a Marker, and
      elements are ordered by increasing s_position of their downstream
      ends (documented; not machine-enforceable structurally). Root
      branches are instantiated from root BeamLines; non-root branches
      arise from Fork elements. The standard defines no serialized
      marking of root vs non-root branches or of multipass physical
      element sets; both remain implicit here.
    slots:
      - name
    slot_usage:
      name:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    attributes:
      periodic:
        description: >-
          True for a periodic (ring-like) branch where the closed orbit
          and Twiss calculation is periodic; false (default) for
          single-pass lines (source/beamlines.md).
        range: boolean
        ifabsent: "false"
      elements:
        description: The ordered, fully expanded list of lattice elements.
        range: LatticeElement
        multivalued: true
        inlined_as_list: true
        required: true

  Lattice:
    description: >-
      Outermost structure holding a set of branches; can describe an
      entire accelerator complex (source/lattice-construction.md). In the
      expanded representation all branches (root and fork-created) are
      present, concrete, and fully expanded.
    slots:
      - name
      - kind
    slot_usage:
      name:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    attributes:
      branches:
        description: The branches of this lattice.
        range: Branch
        multivalued: true
        inlined_as_list: true
        required: true

  PalsRoot:
    description: >-
      The PALS root object (source/fundamentals.md, s:palsroot),
      restricted to the expanded representation: `facility` holds one or
      more fully expanded Lattice entries and nothing else (no
      constants, beam lines, parameter-group definitions, or commands).
    attributes:
      version:
        description: >-
          Version of the PALS schema used in this file. The standard's
          versioning scheme is not yet finalized; null is common.
      authors:
        description: >-
          Authors associated with this file. Optional but recommended for
          data provenance; per author the name is required.
        range: Author
        multivalued: true
        inlined_as_list: true
      notes:
        description: Optional notes of interest.
        multivalued: true
      reminders:
        description: >-
          Optional reminder messages, meant to be communicated to the
          user every time the file is read.
        multivalued: true
      extension_labels:
        description: >-
          Optional registered extension labels that PALS validation shall
          ignore (source/extensions.md).
        range: ExtensionLabels
        inlined: true
      phase_space_coordinates:
        description: >-
          Which of the four phase space coordinate systems is used
          (source/coordinates.md, s:phase.space).
        range: PhaseSpaceCoordinatesEnum
        ifabsent: string(KINETIC_AND_MOMENTUM)
      facility:
        description: >-
          The facility content. EXPANDED REPRESENTATION: one or more
          fully expanded Lattice entries only.
        range: Lattice
        multivalued: true
        inlined_as_list: true
        required: true

  PalsFile:
    tree_root: true
    description: >-
      A PALS file in the EXPANDED representation. The whole document
      hangs off the single top-level `PALS` mapping; information outside
      the `PALS` node is outside the standard and ignored by PALS parsers
      (this schema, being closed, does not model such extra content).
    attributes:
      PALS:
        description: The PALS root object.
        range: PalsRoot
        required: true
        inlined: true
