      t_offset:
        description: Time offset [s].
        range: float
        unit:
          ucum_code: s
      x_rot:
        description: Rotation around x-axis [rad].
        range: float
        unit:
          ucum_code: rad
      y_rot:
        description: Rotation around y-axis [rad].
        range: float
        unit:
          ucum_code: rad
      z_rot:
        description: Rotation around z-axis [rad].
        range: float
        unit:
          ucum_code: rad

  FoilP:
    description: >-
      Foil element parameters (source/parameters/foil.md). Marked
      "In Construction" by the standard.
    attributes:
      dE_ref:
        description: >-
          Reference energy change [eV]; the downstream reference energy is
          E_tot_ref + dE_ref.
        range: float
        unit:
          ucum_code: eV

  ForkP:
    description: >-
      Parameters of a Fork element describing what the fork connects to
      (source/parameters/fork.md). In the expanded representation
      `to_line` names an existing branch of the enclosing lattice (all
      forks are already processed). The destination element kind is
      restricted to Marker, BeginningEle, FloorShift, or Fork
      (source/lattice-construction.md; documented, not machine-enforced).
    attributes:
      to_line:
        description: Name of the branch or beam line to fork to. Required.
        required: true
      destination_element:
        description: >-
          Destination element to fork to; default is the beginning
          element. The name must be unique.
      direction:
        description: Longitudinal direction of travel of the injected beam.
        range: ForkDirectionEnum
        ifabsent: string(FORWARDS)
      new_branch:
        description: >-
          Name to give the newly created destination branch; if null the
          destination element is in an existing branch.
      propagate_reference:
        description: >-
          Propagate reference species and energy (effective only when the
          destination element is the beginning element).
        range: boolean
        ifabsent: "true"

  GirderP:
    description: >-
      Girder parameters (source/parameters/girder.md). The standard marks
      this group "In Construction" and documents no parameters yet.

  MagneticMultipoleP:
    description: >-
      Magnetic multipoles associated with the lattice element
      (source/parameters/magneticmultipole.md). For each order N
      (0 = dipole, 1 = quadrupole, ...) the components are tiltN, field
      strengths BnN/BsN, normalized strengths KnN/KsN with
      (Kn, Ks) = q/P0 * (Bn, Bs), length-integrated variants with L
      appended (BnNL, BsNL, KnNL, KsNL), and tapering parameters
      (*_taper). The actual field is the sum of the field plus the
      tapering field. For a given order the two strength components must
      be of the same type (both integrated or not; both field or both
      normalized) — documented; not machine-enforced. SCHEMA NOTE: slots
      are generated explicitly for orders N = 0..21; higher orders are
      outside what this schema can validate.
    attributes:
      tilt0:
        description: Tilt of the order-0 multipole [rad].
        range: float
      Bn0:
        description: Normal field component of order 0 [T/m^0].
        range: float
      Bs0:
        description: Skew field component of order 0 [T/m^0].
        range: float
      Kn0:
        description: Normalized normal component of order 0 [1/m^1].
        range: float
      Ks0:
        description: Normalized skew component of order 0 [1/m^1].
        range: float
      Bn0L:
        description: Length integrated normal field component of order 0 [T*m/m^0].
        range: float
      Bs0L:
        description: Length integrated skew field component of order 0 [T*m/m^0].
        range: float
      Kn0L:
        description: Length integrated normalized normal component of order 0 [1/m^0].
        range: float
      Ks0L:
        description: Length integrated normalized skew component of order 0 [1/m^0].
        range: float
